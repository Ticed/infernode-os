name: intel-debug (temporary, #786)
on:
  push:
    branches: [ feat/macos-amd64 ]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      ROOT: ${{ github.workspace }}
      OBJTYPE: amd64
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: brew install sdl3 opus libfido2
    - name: build
      run: |
        ./makemk.sh > /dev/null
        export PATH="$ROOT/MacOSX/amd64/bin:/usr/bin:/bin"
        for d in lib9 libbio libmp libsec libmath limbo libinterp libkeyring libmemdraw libmemlayer libdraw libtk; do (cd $d && mk install > /dev/null) || exit 1; done
        (cd emu/MacOSX && SYSTARG=MacOSX SHELL=/bin/sh mk GUIBACK=headless > /dev/null) || exit 1
        PATH="$ROOT/MacOSX/amd64/bin:$PATH" ./tools/verify-dis-build.sh > /dev/null
        /usr/sbin/sysctl -n machdep.cpu.brand_string; /usr/bin/sw_vers; /usr/bin/file emu/MacOSX/o.emu; /usr/bin/otool -L emu/MacOSX/o.emu
    - name: probes
      run: |
        t() { echo "=== $*"; perl -e 'alarm shift; exec @ARGV' 25 "$@" 2>&1 | tail -15; echo "rc=${PIPESTATUS[0]}"; }
        E=./emu/MacOSX/o.emu
        t $E -c0 -r. /dis/echo.dis hello
        t $E -c0 -r. /dis/sh.dis -c 'echo sh ok'
        t $E -c0 -r. /dis/sh.dis -c 'echo before halt; echo halt > /dev/sysctl'
        t $E -c1 -r. /dis/sh.dis -c 'echo jit ok; ls /dis | wc -l; echo halt > /dev/sysctl'
        t $E -c1 -r. /dis/cat.dis /NOTICE
        ROOT=. perl -e 'alarm 120; exec @ARGV' sh tests/host/jit_fault_test.sh 2>&1 | tail -5
