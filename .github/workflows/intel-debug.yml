name: intel-debug (temporary, #786)
on:
  push:
    branches: [ feat/macos-amd64 ]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      ROOT: ${{ github.workspace }}
      OBJTYPE: amd64
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: brew install sdl3 opus libfido2
    - name: build
      run: |
        ./makemk.sh > /dev/null
        export PATH="$ROOT/MacOSX/amd64/bin:/usr/bin:/bin"
        for d in lib9 libbio libmp libsec libmath limbo libinterp libkeyring libmemdraw libmemlayer libdraw libtk; do (cd $d && mk install > /dev/null) || exit 1; done
        (cd emu/MacOSX && SYSTARG=MacOSX SHELL=/bin/sh mk GUIBACK=headless > /dev/null) || exit 1
        PATH="$ROOT/MacOSX/amd64/bin:$PATH" ./tools/verify-dis-build.sh > /dev/null
        /usr/sbin/sysctl -n machdep.cpu.brand_string; /usr/bin/sw_vers; /usr/bin/file emu/MacOSX/o.emu; /usr/bin/otool -L emu/MacOSX/o.emu
    - name: lldb halt
      run: |
        cat > /tmp/l.cmds <<'X'
        process handle SIGSEGV -s true -p false -n true
        process handle SIGBUS -s true -p false -n true
        process handle SIGUSR1 -s false -p true -n false
        process handle SIGPIPE -s false -p true -n false
        run
        thread backtrace all
        register read
        kill
        quit
        X
        perl -e 'alarm 120; exec @ARGV' lldb --batch -s /tmp/l.cmds -- ./emu/MacOSX/o.emu -c0 -r. /dis/sh.dis -c 'echo before halt; echo halt > /dev/sysctl' 2>&1 | tail -150 || true
    - name: halt without SDL-linked device init
      run: |
        perl -e 'alarm 25; exec @ARGV' ./emu/MacOSX/o.emu -c0 -r. /dis/echo.dis x 2>&1; echo rc=$?
        perl -e 'alarm 25; exec @ARGV' ./emu/MacOSX/o.emu -s -c0 -r. /dis/sh.dis -c 'echo halt > /dev/sysctl' 2>&1; echo "rc(-s)=$?"
        ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -3
        f=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1); [ -n "$f" ] && head -c 6000 "$f"
