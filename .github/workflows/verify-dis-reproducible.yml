name: Verify dis reproducible

# dis/ is committed so a downloaded release runs without the user
# building anything.  The price of that is a tree free to drift from
# its source with nothing to say so.  All four ways it can drift have
# already happened here: bytecode went stale (dis/acme.dis shipped
# font paths the source abandoned in March), a module was compiled to
# a path the build never installs to, sources were deleted with their
# binaries left behind (including a Veltro tool removed by a commit
# titled "chore(security)"), and 45 modules shipped that no mkfile
# ever compiled.
#
# This job rebuilds the runtime tree from the tagged source and
# requires the result to be byte-identical to what is committed.  It
# does not reason about where a .dis belongs -- that reasoning is
# what the wrong-target trap defeats.  mk already knows.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build native toolchain
        run: |
          set -e
          export ROOT="$PWD"
          SYSTARG=Linux OBJTYPE=amd64 ./makemk.sh
          export PATH="$ROOT/Linux/amd64/bin:$PATH"
          for d in lib9 libbio libmp libsec libmath utils/iyacc limbo; do
            (cd "$d" && mk install)
          done

      - name: Verify dis/ is exactly what the source compiles to
        run: |
          export ROOT="$PWD"
          export PATH="$ROOT/Linux/amd64/bin:$PATH"
          ./tools/verify-dis-reproducible.sh
